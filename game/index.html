<style>

  }

<canvas id="game" aria-label="SOLMARINA: top-down open-world crime game. Drive, steal cars, dodge police, run missions across the coastal city."></canvas>

<div id="help">WASD move / drive &nbsp;·&nbsp; E steal or exit car &nbsp;·&nbsp; Mouse aim, Click shoot &nbsp;·&nbsp; F punch &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; M mission &nbsp;·&nbsp; P pause &nbsp;·&nbsp; R restart</div>
